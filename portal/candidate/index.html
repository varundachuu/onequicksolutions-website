<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./portal.css" />
  </head>
  <body class="candidate-body">
    <div class="candidate-shell candidate-shell--minimal">
      <main class="candidate-main candidate-main--minimal">
        <div class="candidate-dashboard-layout candidate-dashboard-layout--minimal">
          <aside class="candidate-sidebar candidate-sidebar--minimal reveal">
            <div class="candidate-sidebar__brand">
              <div class="candidate-sidebar__mini-avatar" id="candidate-sidebar-avatar">C</div>
              <div class="candidate-sidebar__mini-copy">
                <strong id="candidate-sidebar-name">Candidate</strong>
                <span id="candidate-sidebar-tag">Verified candidate access</span>
              </div>
            </div>

            <nav class="candidate-sidebar__nav" aria-label="Candidate workspace sections">
              <a class="candidate-nav-link is-active" href="#candidate-workspace-header">
                <span>01</span>
                <div class="candidate-nav-link__copy">
                  <strong>Overview</strong>
                  <small>Workspace home</small>
                </div>
              </a>
              <a class="candidate-nav-link" href="#candidate-workspace-header">
                <span>02</span>
                <div class="candidate-nav-link__copy">
                  <strong>Profile</strong>
                  <small>Account summary</small>
                </div>
              </a>
              <a class="candidate-nav-link" href="/candidate/consent/">
                <span>03</span>
                <div class="candidate-nav-link__copy">
                  <strong>Consent</strong>
                  <small>Review agreement</small>
                </div>
              </a>
            </nav>

            <div class="candidate-sidebar__footer">
              <button class="ghost-button candidate-sidebar__signout" type="button" data-candidate-sign-out>
                Sign Out
              </button>
            </div>
          </aside>

          <section class="candidate-workspace candidate-workspace--minimal">
            <header class="candidate-workspace-header reveal reveal-delay-1" id="candidate-workspace-header">
              <div class="candidate-workspace-header__logos">
                <img
                  class="candidate-header-logo candidate-header-logo--primary"
                  src="/assets/logo/IMG-20251220-WA0001.jpg.jpeg"
                  alt="One Quick Solutions logo"
                />
                <span class="candidate-workspace-header__divider" aria-hidden="true"></span>
                <img
                  class="candidate-header-logo candidate-header-logo--secondary"
                  src="/assets/logo/portal-logo-secondary.png"
                  alt="OneQuickSolutions HR Portal logo"
                />
              </div>

              <div class="candidate-workspace-header__title">
                <strong>Candidate Workspace</strong>
                <span>Post-consent dashboard</span>
              </div>

              <div class="candidate-header-profile">
                <div class="candidate-header-profile__avatar" id="candidate-profile-avatar">C</div>
                <div class="candidate-header-profile__copy">
                  <strong id="candidate-profile-name">Candidate</strong>
                  <span id="candidate-profile-email">candidate@example.com</span>
                </div>
                <span class="candidate-header-profile__status" id="candidate-profile-consent">
                  Consent verified
                </span>
                <button class="ghost-button candidate-header-profile__action" type="button" data-candidate-sign-out>
                  Sign Out
                </button>
              </div>
            </header>

            <section class="workspace-canvas reveal reveal-delay-2" aria-label="Workspace canvas"></section>
          </section>
        </div>
      </main>
    </div>

    <script src="../assets/shared/session.js"></script>
    <script src="./portal.js"></script>
  </body>
</html>
